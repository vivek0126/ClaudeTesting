<template>
    <lightning-card>
      <div class="slds-section slds-is-open" data-id={id} style="margin-top:-45px">
        <h3 class="slds-section__title">
          <button type="button" aria-controls={id} class="slds-button slds-section__title-action" 
              data-buttonid={id} onclick={toggleSection} style="height:42px">
            <lightning-icon icon-name="utility:switch" alternative-text="button icon" size="x-small" 
                class="slds-section__title-action-icon slds-button__icon_left">
            </lightning-icon>
            <span class="slds-truncate" title={Title}>{Title}</span>
          </button>
        </h3>
        <div class="slds-section__content">
          <slot>
            <template lwc:if={_enableEventScreen}>
              <div class="slds-grid slds-wrap slds-p-around_xx-small" style="margin-top:-15px">
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-2 slds-p-around_x-small">
                  <span>
                    <lightning-checkbox-group name="Checkbox Group" label="Business Unit" options={_BUOptions} required 
                        value={selectedBUs} onchange={handleChange}>
                    </lightning-checkbox-group>
                    <lightning-input type="date" label="Event Start Date" min={todayDate} class="slds-m-top_x-small" 
                        message-when-range-underflow="Event Start Date should not be less than today date." required 
                        value={updatedSalesOpsRequestObj.Event_Date__c} onchange={handleChange}>
                    </lightning-input>
                    <template lwc:if={startDateBoolean}>
                      <div style="color: #FF0000;font-size:13px;">{startDateWarning}</div>
                    </template>
                    <lightning-input type="time" label="Event Start Time" class="slds-m-top_x-small" 
                      value={updatedSalesOpsRequestObj.Event_Time__c} onchange={handleChange}>
                    </lightning-input>
                    <lightning-input type="date" label="Event End Date" required 
                        min={endDate} message-when-range-underflow={endDateWarning} 
                        value={updatedSalesOpsRequestObj.Meeting_End_Date__c} onchange={handleChange}>
                    </lightning-input>
                    <lightning-input type="time" label="Event End Time" 
                         value={updatedSalesOpsRequestObj.End_Time__c} onchange={handleChange}>
                    </lightning-input>
                    <lightning-input type="text" label="Sales Sector" required
                          value={updatedSalesOpsRequestObj.Sales_Sector__c} onchange={handleChange} maxlength="30">
                      </lightning-input>
                  </span>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-2 slds-p-around_x-small">
                  <span>
                      <lightning-input label="Requestor" value={requestor} onchange={handleChange}></lightning-input>
                      <lightning-input label="Event Name" value={updatedSalesOpsRequestObj.AEA_Name_of_the_Event__c} 
                          onchange={handleChange}>
                      </lightning-input>
                      <lightning-input type="date" label="Requested Delivery Date" required 
                          min={deliveryDate_min_11} message-when-range-underflow={deliveryDateWarning_min_11} 
                          max={deliveryDate} message-when-range-overflow={deliveryDateWarning} 
                          value={updatedSalesOpsRequestObj.Delivery_Date__c} onchange={handleChange}>
                      </lightning-input>
                      <template lwc:if={Min_11_DateBoolean}>
                      <div style="color: #FF0000;font-size:13px;">{RequestedDateWarning}</div>
                    </template>
                      <lightning-input type="time" label="Delivery Time" 
                          value={updatedSalesOpsRequestObj.Delivery_Time__c} onchange={handleChange}>
                      </lightning-input>
                      <lightning-input type="date" label="Return Pick Up Date" required 
                          min={pickupDateMin} message-when-range-underflow={pickupDateWarning} 
                          max={pickupDate} message-when-range-overflow={pickupDateWarning} 
                          value={updatedSalesOpsRequestObj.Preferred_Pickup_Date__c} onchange={handleChange}>
                      </lightning-input>
                      <lightning-input type="time" label="Pick-Up Time" 
                          value={updatedSalesOpsRequestObj.Pick_up_Time__c} onchange={handleChange}>
                      </lightning-input>
                  </span>
                </div>
              </div>
            </template>
            <template lwc:elseif={_enableShippingScreen}>
              <div class="slds-grid slds-wrap slds-p-around_xx-small" style="margin-top:-15px">
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-2 slds-p-around_x-small">
                  <span>
                    <lightning-record-picker label="Receiver" placeholder="Search Receiver..." 
                         value={updatedSalesOpsRequestObj.Receiver__c} required="true" onchange={handleChange} 
                         object-api-name="User">
                    </lightning-record-picker>
                    <lightning-input type="Email" label="Email" value={updatedSalesOpsRequestObj.Receiver_Email__c} 
                         onchange={handleChange}>
                    </lightning-input>
                    <lightning-input label="Primary Address Line 1" value={updatedSalesOpsRequestObj.Street__c} required="true" 
                         onchange={handleChange}>
                    </lightning-input>
                    <lightning-input label="Primary City" value={updatedSalesOpsRequestObj.City__c} required 
                        onchange={handleChange}>
                    </lightning-input>
                    <template lwc:if={_stateRequired}>
                      <template lwc:if={usaStateRequired}>
                        <lightning-combobox label="Primary State" options={_stateOptions} value={updatedSalesOpsRequestObj.State__c} 
                            onchange={handleChange} required>
                        </lightning-combobox>
                      </template>
                      <template lwc:if={stateNotRequired}>
                        <lightning-combobox label="Primary State" options={_stateOptions} value={updatedSalesOpsRequestObj.State__c} 
                            onchange={handleChange}>
                        </lightning-combobox>
                      </template>
                    </template>
                    <lightning-input label="Additional Shipping Instructions" value={updatedSalesOpsRequestObj.Delivery_Instructions__c} 
                         onchange={handleChange}>
                    </lightning-input>
                  </span>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-2 slds-p-around_x-small">
                  <span>
                      <lightning-input label="Phone Number" type="tel" value={updatedSalesOpsRequestObj.Receiver_Phone_number__c} 
                          required="true" onchange={handleChange}>
                      </lightning-input>
                      <lightning-combobox label="Venue Type" options={businessOrResidenceOptions} required="true" 
                          value={updatedSalesOpsRequestObj.Venue_Type__c} onchange={handleChange}>
                      </lightning-combobox>
                      <lightning-input label="Primary Address Line 2" value={updatedSalesOpsRequestObj.Primary_Address_Line_2__c} 
                          onchange={handleChange}>
                      </lightning-input>
                      <lightning-combobox label="Primary Country" value={updatedSalesOpsRequestObj.Shipping_Country__c} 
                          onchange={handleChange} options={_countryOptions} required="true">
                      </lightning-combobox>
                      <lightning-input label="Primary Zip/Postal Code" value={updatedSalesOpsRequestObj.Zip_Postal_Code__c} 
                          required="true" onchange={handleChange}>
                      </lightning-input>
                  </span>
                </div>
              </div>
            </template>
          </slot>
        </div>
      </div>
      <hr class="slds-m-horizontal" style="margin-left: -16px; margin-right: -16px; margin-bottom: 10px; margin-top: 5px">
      <div class="slds-grid slds-grid_align-end">
        <div class="slds-col">
          
          <lightning-button label={screenSetup.Back} title="Non-primary action" onclick={Back_Next_Handler} 
              class="slds-m-right_x-small" variant="brand-outline" data-action={screenSetup.Back} 
              disabled={screenSetup.buttonDisabled}>
          </lightning-button>
      
        </div>
        <div class="slds-col ">
          <lightning-button variant="brand" label={screenSetup.Next} title="Primary action" onclick={Back_Next_Handler} 
              class="" data-action={screenSetup.Next} disabled={screenSetup.buttonDisabled}>
          </lightning-button>
        </div>
      </div>
    </lightning-card>
