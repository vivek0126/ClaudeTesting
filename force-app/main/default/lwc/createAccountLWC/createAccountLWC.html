<template>
    <div class="slds-box slds-theme_default">
        <h2 class="slds-text-heading_medium">Create Account</h2>
        <div class="slds-m-bottom_medium">
            <lightning-input
                label="Name"
                type="text"
                value={accountName}
                onchange={handleInputChange}
                data-field="Name">
            </lightning-input>
        </div>
        <div class="slds-m-bottom_medium">
            <lightning-input
                label="Phone"
                type="tel"
                value={accountPhone}
                onchange={handleInputChange}
                data-field="Phone">
            </lightning-input>
        </div>
        <div class="slds-m-bottom_medium">
            <lightning-input
                label="Address"
                type="text"
                value={accountAddress}
                onchange={handleInputChange}
                data-field="Address">
            </lightning-input>
        </div>
        <lightning-button label="Create Account" name="CreateAccount" variant="brand" onclick={createAccount}></lightning-button>
    </div>
</template>
